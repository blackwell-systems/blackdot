set -as terminal-overrides ',*:U8=0'
set -g allow-passthrough on  # forward Kitty graphics protocol to outer terminal
# ==========================================================
# 1. CORE BINDINGS (The "Brains")
# ==========================================================
# Set prefix to Ctrl-A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Easy reloading of config
bind r source-file ~/.config/tmux/.tmux.conf \; display "Config Reloaded!"

# Rational splits (using | and -)
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Enable mouse mode (scrolling, resizing)
set -g mouse on

# ==========================================================
# 2. STATUS BAR & COLORS (The "Inverted" Look)
# ==========================================================
set -g status-position bottom
set -g status-justify centre
set -g status-style 'bg=cyan,fg=black'

# Active Window (Dark Block)
set -g window-status-current-style 'fg=cyan,bg=black,bold'
set -g window-status-current-format ' [#I:#W] '

# Inactive Windows (Light Block)
set -g window-status-style 'fg=black,bg=cyan'
set -g window-status-format '  #I:#W  '

# ==========================================================
# 3. NERD FONT LOGOS (The "Ghost-Free" Version)
# ==========================================================
set -g status-left-length 30
# Note: The extra spaces after  and  prevent the '0' ghosting
set -g status-left '#[fg=black,bold,bg=green]   #[fg=green,bg=cyan]'

set -g status-right-length 50
set -g status-right '#[fg=black]#[fg=cyan,bg=black]  %Y-%m-%d   %H:%M '

# ==========================================================
# 4. PLUGINS (TPM)
# ==========================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
