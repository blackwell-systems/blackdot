title: 'Inspection Report Fixes: Init Side Effect + Error Context (Color Consolidation Deferred)'
feature_slug: inspection-fixes
verdict: SUITABLE_WITH_CAVEATS
suitability_assessment: |
    Analysis of three medium-priority inspection issues from 2026-04-14T07-23-03 report.

    **Proceeding with Issues #6 and #8 only. Deferring Issue #7 (color consolidation) to
    sequential implementation outside SAW framework due to scope and LOC budget constraints.**

    **Issue #6: Init Side Effect in sync.go** — SUITABLE
      - Location: internal/cli/sync.go:37
      - Problem: Silently ignores os.UserHomeDir() error in init()
      - Fix: Move to lazy evaluation with sync.Once (~10 lines changed)
      - Parallelization value: None (1 file), but benefits from structured review

    **Issue #8: Missing Error Context** — SUITABLE
      - Location: 62 instances in tools_*.go files (7 files, ~6,169 lines total)
      - Problem: Bare "return err" without wrapping loses context
      - Fix: Wrap errors with fmt.Errorf("context: %w", err)
      - Parallelization value: HIGH (7 agents × ~880 lines each, fully independent)

    **Issue #7: Duplicate Color Exports** — NOT SUITABLE FOR SAW (DEFERRED)
      - Location: internal/cli/output.go + 34 consumer files
      - Total LOC: 15,970 lines across 35 files
      - V048 LOC budget: 2000 lines per agent → requires 8+ agents in sequential waves
      - Parallelization value: NONE (sequential waves, no time savings)
      - Recommendation: Implement sequentially using automated refactoring tools (sed, gofmt -r)

    **VERDICT: SUITABLE_WITH_CAVEATS**

    Time-to-value estimate (Issues #6 + #8 only):
      - Scout phase: ~10 min
      - Wave 1 (7 agents, parallel): ~7-10 min
      - Wave 2 (1 agent): ~2-3 min
      - Merge & verification: ~2-3 min
      Total SAW time: ~21-26 min

      Sequential baseline: ~40-50 min
      Time savings: ~15-25 min (40-60% faster)
