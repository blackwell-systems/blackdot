interface_contracts:
    - name: configLayerPaths (lazy resolver)
      description: |-
        Replace the package-level vars + init() block in cli/config.go with a
        lazy resolver function. No exported type change — purely internal refactor.
      definition: |
        // Before (lines 14-25):
        var (
            configLayerUser    = filepath.Join(os.Getenv("HOME"), ".config", "blackdot", "config.json")
            configLayerMachine = filepath.Join(os.Getenv("HOME"), ".config", "blackdot", "machine.json")
        )
        func init() {
            if xdg := os.Getenv("XDG_CONFIG_HOME"); xdg != "" {
                configLayerUser = filepath.Join(xdg, "blackdot", "config.json")
                configLayerMachine = filepath.Join(xdg, "blackdot", "machine.json")
            }
        }

        // After: delete the vars and init(), replace with:
        func configPaths() (userPath, machinePath string) {
            mgr := config.DefaultManager()
            return mgr.UserConfigPath(), mgr.MachineConfigPath()
        }
      location: internal/cli/config.go
    - name: getNestedValue version case fix
      description: Replace the ASCII-arithmetic version serialization in config.go with strconv.Itoa.
      definition: |
        // Before (line 258):
        case "version":
            return string(rune(cfg.Version + '0')), nil

        // After:
        case "version":
            return strconv.Itoa(cfg.Version), nil
      location: internal/config/config.go
waves:
    - number: 1
      agents:
        - id: A
          task: |
            ## Agent A — Delete dead checkTerminal() function (H-1)

            ### Context
            `internal/cli/style.go` contains a dead unexported function `checkTerminal()`
            at line 221. It has zero callers (LSP Tier 1A confirmed). It also silently
            discards the error from `os.Stdout.Stat()` with `_`. Delete it entirely.

            ### What to implement
            1. Open `internal/cli/style.go`.
            2. Delete the function and its comment at lines 219-224. The exact text to
               remove is:

               ```go


               // checkTerminal returns true if stdout is a terminal
               func checkTerminal() bool {
               	fileInfo, _ := os.Stdout.Stat()
               	return (fileInfo.Mode() & os.ModeCharDevice) != 0
               }
               ```

            3. If `os` is no longer used anywhere else in style.go after deletion,
               remove it from the import block. Check for other `os.` usages before
               removing.

            ### Verification gate
            ```bash
            # Build
            go build ./internal/cli/...

            # Lint
            go vet ./internal/cli/...

            # Confirm symbol is gone
            grep -n "checkTerminal" /Users/dayna.blackwell/workspace/blackdot/internal/cli/style.go
            # Expected: no output

            # Confirm no callers anywhere
            grep -rn "checkTerminal" /Users/dayna.blackwell/workspace/blackdot/internal/
            # Expected: no output
            ```

            ### Constraints
            - Do NOT modify any other function in style.go.
            - Do NOT modify files outside your ownership list (internal/cli/style.go).
            - If the `os` import is still used elsewhere in style.go, leave it in place.
          files:
            - internal/cli/style.go
        - id: B
          task: |
            ## Agent B — Guard os.WriteFile return values in sync.go (H-2)

            ### Context
            `internal/cli/sync.go` has two silent write failures:
            - Line 588 in `updateSyncTimestamps`: `os.WriteFile(configFile, updatedData, 0644)`
            - Line 634 in `saveDriftState`: `os.WriteFile(driftStateFile, data, 0644)`

            Both functions have `void` signature (return nothing). The fix is to log
            with `Warn()` when the write fails rather than silently dropping the error.
            Do NOT change the function signatures — callers do not check return values
            and changing signatures would require updating multiple call sites.

            ### What to implement

            **Fix 1 — updateSyncTimestamps (line 588):**

            Find this exact text:
            ```go
            	os.WriteFile(configFile, updatedData, 0644)
            }
            ```

            Replace it with:
            ```go
            	if err := os.WriteFile(configFile, updatedData, 0644); err != nil {
            		Warn("failed to persist sync timestamps: %v", err)
            	}
            }
            ```

            **Fix 2 — saveDriftState (line 634):**

            Find this exact text:
            ```go
            	os.WriteFile(driftStateFile, data, 0644)
            }
            ```

            Replace it with:
            ```go
            	if err := os.WriteFile(driftStateFile, data, 0644); err != nil {
            		Warn("failed to save drift state: %v", err)
            	}
            }
            ```

            ### Verification gate
            ```bash
            # Build
            go build ./internal/cli/...

            # Lint
            go vet ./internal/cli/...

            # Confirm both os.WriteFile calls are now guarded
            grep -n "os.WriteFile" /Users/dayna.blackwell/workspace/blackdot/internal/cli/sync.go
            # Expected: both lines show `if err := os.WriteFile`

            # Run tests
            go test ./internal/cli/...
            ```

            ### Constraints
            - Do NOT change the signatures of updateSyncTimestamps or saveDriftState.
            - Do NOT refactor the hardcoded config path in updateSyncTimestamps — that
              is a separate issue (scope of M-4 already assigned to Agent C). Focus
              only on guarding the two WriteFile calls.
            - Do NOT modify files outside your ownership list (internal/cli/sync.go).
          files:
            - internal/cli/sync.go
        - id: C
          task: |
            ## Agent C — Fix init() side effects and duplicate config resolution in cli/config.go (M-2, M-4)

            ### Context
            Two issues in `internal/cli/config.go`:

            **M-2 — init() side effect:**
            Lines 14-25 initialize package-level globals from environment at import
            time, breaking test isolation. Replace with a lazy `configPaths()` helper
            that reads the environment at call time using `config.DefaultManager()`.

            **M-4 — Duplicate config resolution:**
            `configGet()` (line 256) and `configShow()` (line 321) re-implement the
            5-layer config resolution already in `config.Manager.GetLayered()`, with
            divergences in path normalization, error handling, and symlink resolution.
            Replace these two functions to delegate to `config.DefaultManager().GetLayered()`.

            The other helpers (`getFromJSONFile`, `findProjectConfig`, `setInJSONFile`,
            `loadJSONInto`) are still used by `configSet`, `configSource`, `configList`,
            `configMerged`, `configInit`, and `configEdit` — do NOT delete them.

            ### What to implement

            **Step 1 — Remove package-level vars and init():**

            Delete this block (lines 14-25):
            ```go
            // Config layer paths
            var (
            	configLayerUser    = filepath.Join(os.Getenv("HOME"), ".config", "blackdot", "config.json")
            	configLayerMachine = filepath.Join(os.Getenv("HOME"), ".config", "blackdot", "machine.json")
            )

            func init() {
            	if xdg := os.Getenv("XDG_CONFIG_HOME"); xdg != "" {
            		configLayerUser = filepath.Join(xdg, "blackdot", "config.json")
            		configLayerMachine = filepath.Join(xdg, "blackdot", "machine.json")
            	}
            }
            ```

            **Step 2 — Add a lazy configPaths() helper:**

            Add this function after the deletion point (before the `newConfigCmd`
            function):
            ```go
            // configPaths returns the resolved user and machine config paths.
            // Environment variables are read at call time (lazy evaluation).
            func configPaths() (userPath, machinePath string) {
            	mgr := config.DefaultManager()
            	return mgr.UserConfigPath(), mgr.MachineConfigPath()
            }
            ```

            **Step 3 — Update all references to configLayerUser and configLayerMachine:**

            Search for every use of `configLayerUser` and `configLayerMachine` in the
            file and replace them with a call to `configPaths()`. There are
            approximately 8 reference sites. For each site, assign the result of
            `configPaths()` to local variables at the top of the function:
            ```go
            userPath, machinePath := configPaths()
            ```
            Then replace `configLayerUser` → `userPath` and
            `configLayerMachine` → `machinePath` within that function.

            Functions that use these globals: `configGet`, `configSet`, `configShow`,
            `configSource`, `configList`, `configMerged`, `configEdit`,
            `configInitMachine`.

            **Step 4 — Replace configGet() to use GetLayered():**

            Replace the body of `configGet` (lines 256-289) to delegate to
            `config.DefaultManager().GetLayered()`:
            ```go
            func configGet(key, defaultVal string) error {
            	result, err := config.DefaultManager().GetLayered(key)
            	if err != nil {
            		return fmt.Errorf("config get %s: %w", key, err)
            	}
            	if result.Value != "" {
            		fmt.Println(result.Value)
            		return nil
            	}
            	if defaultVal != "" {
            		fmt.Println(defaultVal)
            	}
            	return nil
            }
            ```

            **Step 5 — Replace configShow() to use GetLayered() for the active-layer display:**

            The current `configShow` (lines 321-374) manually walks layers and prints
            which one is "active". Replace it to show all layer values using the
            manager's path methods, but keep the display format consistent:
            ```go
            func configShow(key string) error {
            	PrintHeader("Config: " + key)
            	mgr := config.DefaultManager()

            	layers := []struct {
            		label string
            		fetch func() string
            	}{
            		{"env", func() string {
            			envKey := "BLACKDOT_" + strings.ToUpper(strings.ReplaceAll(key, ".", "_"))
            			return os.Getenv(envKey)
            		}},
            		{"project", func() string {
            			if path := mgr.ProjectConfigPath(); path != "" {
            				return getFromJSONFile(path, key)
            			}
            			return ""
            		}},
            		{"machine", func() string {
            			return getFromJSONFile(mgr.MachineConfigPath(), key)
            		}},
            		{"user", func() string {
            			return getFromJSONFile(mgr.UserConfigPath(), key)
            		}},
            	}

            	active := false
            	for _, l := range layers {
            		val := l.fetch()
            		if val != "" {
            			if !active {
            				fmt.Printf("  %-9s %s  %s\n", l.label+":", val, Green.Sprint("<- active"))
            				active = true
            			} else {
            				fmt.Printf("  %-9s %s\n", l.label+":", val)
            			}
            		} else {
            			fmt.Printf("  %-9s %s\n", l.label+":", Dim.Sprint("(not set)"))
            		}
            	}
            	return nil
            }
            ```

            **Step 6 — Update imports:**

            Add `"github.com/blackwell-systems/blackdot/internal/config"` to the import
            block if it is not already present. Remove `"path/filepath"` from imports
            only if no other function in the file still uses it (check: `configInitMachine`
            uses `filepath.Dir`, so keep it). Remove `"os/exec"` only if unused after
            edits (it is used by `configEdit` — keep it).

            ### Verification gate
            ```bash
            # Build
            go build ./internal/cli/...

            # Lint
            go vet ./internal/cli/...

            # Confirm init() is gone
            grep -n "^func init()" /Users/dayna.blackwell/workspace/blackdot/internal/cli/config.go
            # Expected: no output

            # Confirm configLayerUser is gone
            grep -n "configLayerUser\|configLayerMachine" /Users/dayna.blackwell/workspace/blackdot/internal/cli/config.go
            # Expected: no output

            # Confirm configPaths() helper is present
            grep -n "func configPaths" /Users/dayna.blackwell/workspace/blackdot/internal/cli/config.go
            # Expected: 1 line

            # Run tests
            go test ./internal/cli/...
            ```

            ### Constraints
            - Do NOT delete getFromJSONFile, findProjectConfig, setInJSONFile, or
              loadJSONInto — they are still used by other functions in the file.
            - Do NOT change the public-facing behavior of configGet or configShow —
              output format should remain compatible.
            - Do NOT modify files outside your ownership list (internal/cli/config.go).
          files:
            - internal/cli/config.go
        - id: D
          task: |
            ## Agent D — Delete 26 dead exports from output.go (M-1)

            ### Context
            `internal/cli/output.go` exports 26 symbols with zero non-test callers
            (LSP Tier 1A confirmed). These are:
            - 19 dead `Clr*` vars: `ClrPrimary`, `ClrSecondary`, `ClrSuccess`,
              `ClrError`, `ClrWarning`, `ClrInfo`, `ClrMuted`, `ClrBold`, `ClrHeader`,
              `ClrBox`, `ClrRust`, `ClrGo`, `ClrPython`, `ClrAWS`, `ClrCDK`,
              `ClrNode`, `ClrJava`, `ClrSSH`, `ClrDocker`
            - 3 dead combined-style vars: `BoldGreen`, `BoldRed` (BoldCyan is USED —
              do not delete it)
            - 4 dead functions: `Section()`, `Separator()`, `NoColor()`, `ForceColor()`,
              `IsColorEnabled()`

            Note: The legacy names (`Red`, `Green`, `Yellow`, `Blue`, `Cyan`, `Magenta`,
            `Bold`, `Dim`, `BoldCyan`) are ALL actively used — do NOT delete them.

            ### What to implement

            **Step 1 — Delete the semantic Clr* var block (lines 18-41):**

            Delete this entire `var` block:
            ```go
            var (
            	// Semantic colors
            	ClrPrimary   = color.New(color.FgCyan)             // Main accent, highlights
            	ClrSecondary = color.New(color.FgYellow)           // Secondary accent
            	ClrSuccess   = color.New(color.FgGreen)            // Success, enabled, OK
            	ClrError     = color.New(color.FgRed)              // Errors, failures, disabled
            	ClrWarning   = color.New(color.FgYellow)           // Warnings, caution
            	ClrInfo      = color.New(color.FgBlue)             // Informational
            	ClrMuted     = color.New(color.Faint)              // Dim - secondary text
            	ClrBold      = color.New(color.Bold)               // Emphasis
            	ClrHeader    = color.New(color.Bold, color.FgCyan) // Bold cyan for headers
            	ClrBox       = color.New(color.Faint)              // Box borders

            	// Tool-specific brand colors (match official brand colors)
            	ClrRust   = color.New(color.FgYellow)  // Orange (Rust's brand color)
            	ClrGo     = color.New(color.FgCyan)    // Cyan/Teal (Go's gopher blue)
            	ClrPython = color.New(color.FgBlue)    // Blue (Python's blue)
            	ClrAWS    = color.New(color.FgYellow)  // Orange (AWS's orange)
            	ClrCDK    = color.New(color.FgGreen)   // Green (CDK/CloudFormation green)
            	ClrNode   = color.New(color.FgGreen)   // Green (Node.js green)
            	ClrJava   = color.New(color.FgRed)     // Red (Java red)
            	ClrSSH    = color.New(color.FgMagenta) // Magenta (SSH/security purple)
            	ClrDocker = color.New(color.FgCyan)    // Cyan (Docker's blue/teal)
            )
