            	fmt.Fprintln(os.Stderr, "────────────────────────────────────────")
            }
            ```

            Function 3-5 (color control block — delete the section header comment
            and all three functions):
            ```go
            // ============================================================
            // Color Control
            // ============================================================

            // NoColor disables color output (for piping, CI, etc.)
            func NoColor() {
            	color.NoColor = true
            }

            // ForceColor forces color output even when not a TTY
            func ForceColor() {
