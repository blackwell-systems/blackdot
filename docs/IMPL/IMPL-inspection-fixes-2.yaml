        - id: E
          task: |
            ## Agent E — Fix version serialization bug and unexport config constants; delete dead Engine type (M-3, L-3, M-5)

            ### Context

            **M-3 — Version serialization bug in internal/config/config.go:**
            Line 258: `return string(rune(cfg.Version + '0')), nil`
            This produces a garbage character for Version >= 10. Fix with strconv.Itoa.

            **L-3 — Over-exported constants in internal/config/config.go:**
            `ProjectConfigFile`, `MachineConfigFile`, `UserConfigFile`, `LayerEnv`,
            `LayerProject`, `LayerMachine`, `LayerUser`, `LayerDefault` are all
            exported but have zero external callers (only used within the config
            package itself and its tests). Unexport them.

            **M-5 — Dead Engine type in internal/template/engine.go:**
            The regex-based `Engine` struct and `NewEngine()` function are superseded
            by `RaymondEngine`. All 4 production callsites use `NewRaymondEngine`.
            Delete the entire engine.go file.

            ### What to implement

            #### internal/config/config.go changes:

            **Fix 1 — Version serialization (line 258):**

            Find:
            ```go
            	case "version":
            		return string(rune(cfg.Version + '0')), nil
            ```

            Replace with:
            ```go
            	case "version":
            		return strconv.Itoa(cfg.Version), nil
            ```

            Then add `"strconv"` to the import block. The current imports are:
            ```go
            import (
            	"encoding/json"
            	"errors"
            	"os"
            	"path/filepath"
            	"strings"
            )
            ```

            Replace with:
            ```go
            import (
            	"encoding/json"
            	"errors"
            	"os"
            	"path/filepath"
            	"strconv"
            	"strings"
            )
            ```

            **Fix 2 — Unexport Layer type and constants (lines 17-26):**

            Find:
            ```go
            // Layer represents a configuration layer
            type Layer string

            const (
            	LayerEnv     Layer = "env"
            	LayerProject Layer = "project"
            	LayerMachine Layer = "machine"
            	LayerUser    Layer = "user"
            	LayerDefault Layer = "default"
            )
            ```

            Replace with:
            ```go
