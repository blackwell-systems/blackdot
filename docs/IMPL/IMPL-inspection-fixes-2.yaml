          task: |
            ## Agent F — Fix nil cobra.Command in runBackupRestore; document BlackdotDir limitation (L-4, L-1)

            ### Context

            **L-4 — nil *cobra.Command in runBackupRestore:**
            `internal/cli/backup.go` line 346 defines:
            ```go
            func runBackupRestore(cmd *cobra.Command, args []string) error {
                return runBackupRestoreImpl(cmd, args, false)
            }
            ```
            Called from `internal/cli/rollback.go` line 314 as:
            ```go
            return runBackupRestore(nil, []string{backupID})
            ```
            The `nil` cmd is safe today only because `runBackupRestoreImpl` never
            dereferences `cmd`. The fix is to thread the real `cmd` from the rollback
            call site, or — since `runBackupRestore` is just a thin wrapper — replace
            the call to go directly to `runBackupRestoreImpl`.

            **L-1 — BlackdotDir() returns "" before Cobra init:**
            `internal/cli/root.go:145-147` — `BlackdotDir()` returns `blackdotDir`
            which is `""` until `initConfig()` runs via `cobra.OnInitialize`. Add a
            comment that documents the limitation so future callers understand the
            invariant. Do NOT attempt to use sync.Once here — the existing Cobra
            OnInitialize pattern is intentional and documented in the checks-clean
            section of the inspection report.

            ### What to implement

            #### internal/cli/rollback.go — fix the nil cmd call (L-4):

            Find the call site in rollback.go. The exact surrounding context is:
            ```go
            	return runBackupRestore(nil, []string{backupID})
            ```

            Replace with a direct call to `runBackupRestoreImpl`:
            ```go
            	return runBackupRestoreImpl(nil, []string{backupID}, false)
            ```

            This makes the nil explicit at the lowest level and removes the intermediary
            wrapper as the call path. Now check whether `runBackupRestore` itself has
            any other callers:
            ```bash
            grep -rn "runBackupRestore\b" /Users/dayna.blackwell/workspace/blackdot/
            ```

            If `runBackupRestore` is now called only from Cobra's command registration
            (as a `RunE` handler where Cobra will always pass a non-nil `cmd`), leave
            the function in place. If it has zero callers after the rollback.go fix,
            delete it from backup.go.

            #### internal/cli/root.go — document BlackdotDir() invariant (L-1):

            Find this exact block (lines 144-147):
            ```go
            // BlackdotDir returns the resolved blackdot directory path
            func BlackdotDir() string {
            	return blackdotDir
            }
            ```

            Replace with:
            ```go
            // BlackdotDir returns the resolved blackdot directory path.
            // NOTE: Returns "" if called before Cobra initialization completes.
            // blackdotDir is populated by initConfig(), which is registered via
            // cobra.OnInitialize and runs before any command's RunE function.
            // Do not call BlackdotDir() from package init() or during import.
            func BlackdotDir() string {
            	return blackdotDir
            }
            ```

            ### Verification gate
            ```bash
            # Build
            go build ./internal/cli/...

            # Lint
            go vet ./internal/cli/...

            # Confirm rollback.go no longer passes nil through runBackupRestore
            grep -n "runBackupRestore(" /Users/dayna.blackwell/workspace/blackdot/internal/cli/rollback.go
            # Expected: no output (call replaced with runBackupRestoreImpl directly)

            # Confirm BlackdotDir has the warning comment
            grep -A5 "func BlackdotDir" /Users/dayna.blackwell/workspace/blackdot/internal/cli/root.go
            # Expected: comment about returning "" before Cobra initialization

            # Run tests
            go test ./internal/cli/...
            ```

            ### Constraints
            - Do NOT attempt to fix the nil by passing a real cmd in rollback.go if
              that requires threading cmd through several call levels — the direct call
              to runBackupRestoreImpl(nil, ..., false) is the correct minimal fix.
            - Do NOT add sync.Once or lazy initialization to BlackdotDir() — the
              inspection report explicitly clears the Cobra OnInitialize pattern. A
              comment is sufficient.
            - Do NOT modify files outside your ownership list
              (internal/cli/backup.go, internal/cli/rollback.go, internal/cli/root.go).
          files:
            - internal/cli/backup.go
            - internal/cli/rollback.go
            - internal/cli/root.go
