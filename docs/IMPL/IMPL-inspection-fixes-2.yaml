            const (
            	layerEnv     layer = "env"
            	layerProject layer = "project"
            	layerMachine layer = "machine"
            	layerUser    layer = "user"
            	layerDefault layer = "default"
            )
            ```

            **Fix 3 — Unexport config file name constants (lines 29-33):**

            Find:
            ```go
