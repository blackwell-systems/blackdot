            // Semantic Colors (from lib/_colors.sh)
            // These describe WHAT the color means, not what it looks like
            // ============================================================
            ```

            **Step 2 — Delete the legacy var block's aliases that pointed to the Clr* vars:**

            The legacy block (lines 46-55) currently aliases legacy names to Clr* names:
            ```go
            var (
            	Red     = ClrError
            	Green   = ClrSuccess
            	Yellow  = ClrWarning
            	Blue    = ClrInfo
            	Cyan    = ClrPrimary
            	Magenta = color.New(color.FgMagenta)
            	Bold    = ClrBold
            	Dim     = ClrMuted
            )
            ```

            After deleting the Clr* block, these aliases will break. Replace the
            entire legacy var block with direct color.New() calls:
            ```go
            // ============================================================
            // Colors
            // ============================================================
            var (
            	Red     = color.New(color.FgRed)
            	Green   = color.New(color.FgGreen)
            	Yellow  = color.New(color.FgYellow)
            	Blue    = color.New(color.FgBlue)
            	Cyan    = color.New(color.FgCyan)
            	Magenta = color.New(color.FgMagenta)
            	Bold    = color.New(color.Bold)
            	Dim     = color.New(color.Faint)
            )
            ```

            **Step 3 — Delete BoldGreen and BoldRed from the combined styles block:**

            Find:
            ```go
            // Combined styles
            var (
            	BoldCyan  = color.New(color.Bold, color.FgCyan)
            	BoldGreen = color.New(color.Bold, color.FgGreen)
            	BoldRed   = color.New(color.Bold, color.FgRed)
