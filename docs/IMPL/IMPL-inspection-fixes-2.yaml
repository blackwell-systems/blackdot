title: Inspection Fixes 2 — 2026-04-15 Quality Report
feature_slug: inspection-fixes-2
verdict: SUITABLE
suitability_assessment: |
    11 issues from the 2026-04-15 inspection report, spanning 7 distinct files across
    4 packages (internal/cli, internal/config, internal/template). File decomposition
    is clean: each issue maps to a separate file or a clearly bounded region within a
    file, yielding disjoint ownership in a single wave.

    L-2 (RaymondEngine zero test coverage) is already resolved. The test file
    internal/template/raymond_engine_test.go contains 15+ test functions that all call
    NewRaymondEngine — the inspection report was based on a stale read. This finding
    is marked DONE and no agent is needed.

    M-1 (26 dead color exports) and M-4 (duplicate config resolution) were flagged as
    potentially requiring multi-wave approaches. Assessment:
    - M-1: All callers of the dead symbols are zero (LSP Tier 1A confirmed). Deletion
      is safe in a single wave — no callers to update. One agent owns output.go.
    - M-4: The fix is to replace the body of configGet() and configShow() in
      cli/config.go with calls to config.DefaultManager().GetLayered(). The internal
      helpers (getFromJSONFile, findProjectConfig) remain in place because configSet,
      configSource, configList, configMerged, configEdit, configInit still use them
      directly. Scope is bounded to modifying two functions in one file — single wave.

    M-2 (init side effects) and M-4 (duplicate config) both touch cli/config.go but
    at non-overlapping regions: M-2 fixes lines 14-25 (package-level vars + init()),
    M-4 fixes configGet() (line 256) and configShow() (line 321). These are assigned
    to the same agent (Agent C) to avoid I1 conflict.

    Suitability: SUITABLE — 5 agents, fully independent, single wave.

    Estimated times:
    - Scout phase: ~15 min
    - Agent execution: ~5 agents x ~8 min avg = ~40 min wall clock (all parallel)
    - Merge and verification: ~5 min
    Total SAW time: ~60 min
    Sequential baseline: ~5 x 12 min = ~60 min
    Recommendation: Marginal speed gain; primary value is parallel isolation and
    audit trail (each fix independently testable in its own worktree).
