            const (
            	projectConfigFile = ".blackdot.json"
            	machineConfigFile = "machine.json"
            	userConfigFile    = "config.json"
            )
            ```

            **Fix 4 — Update all internal references to the now-unexported symbols:**

            After renaming, update every reference within config.go:
            - `LayerResult.Source` field type changes from `Layer` to `layer` — update
              the struct definition accordingly.
            - All constants: `LayerEnv` → `layerEnv`, `LayerProject` → `layerProject`,
              `LayerMachine` → `layerMachine`, `LayerUser` → `layerUser`,
