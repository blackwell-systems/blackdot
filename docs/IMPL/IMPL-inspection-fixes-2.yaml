            ### Constraints
            - Do NOT delete Red, Green, Yellow, Blue, Cyan, Magenta, Bold, Dim, or
              BoldCyan — these are actively used throughout internal/cli/*.go.
            - Do NOT delete Section() if it has any callers. Before deleting, run:
              grep -rn "Section(" /Users/dayna.blackwell/workspace/blackdot/internal/
              and verify only output.go itself appears (the comment lines in doctor.go
